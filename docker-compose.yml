# ============================================================
# Stack universelle — noyau (lot A2)
# Appel: ./stack <args>  ==  docker compose --env-file versions.env --env-file .env [...]
# Réseau interne unique ai_net. AUCUN ports: ici (seul caddy publiera 80/443, lot A3).
# ============================================================
name: ${COMPOSE_PROJECT_NAME:-ustack}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ---------------- Postgres 17 (bases: n8n, litellm, langfuse, openwebui) ----------------
  postgres:
    image: ${IMG_POSTGRES:?IMG_POSTGRES manquant (versions.env)}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: postgres
    expose:
      - "5432"
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ai_net]
    logging: *default-logging
    # Limites indicatives (décommenter si besoin):
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- Redis 7 (UN conteneur; noeviction exigé par Langfuse/n8n) ----------------
  redis:
    image: ${IMG_REDIS:?IMG_REDIS manquant (versions.env)}
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      TZ: ${TZ:-Europe/Paris}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | /bin/grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 1g
    #   cpus: 1.0

  # ---------------- Qdrant (vecteurs) ----------------
  qdrant:
    image: ${IMG_QDRANT:?IMG_QDRANT manquant (versions.env)}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY manquant}
    expose:
      - "6333"
    volumes:
      - ${DATA_DIR:-./data}/qdrant:/qdrant/storage
    healthcheck:
      # Image sans curl/wget: sonde HTTP /healthz via bash /dev/tcp (bash présent, vérifié)
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r l <&3; [[ $$l == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- Ollama (embeddings + modèle de décision) ----------------
  ollama:
    image: ${IMG_OLLAMA:?IMG_OLLAMA manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    environment:
      TZ: ${TZ:-Europe/Paris}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "4"
    expose:
      - "11434"
    volumes:
      - ${DATA_DIR:-./data}/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 16g
    #   cpus: 8.0

  # ---------------- ollama-init (one-shot: pull des modèles) ----------------
  ollama-init:
    image: ${IMG_OLLAMA:?IMG_OLLAMA manquant (versions.env)}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:?EMBED_MODEL manquant}
      DECISION_MODEL: ${DECISION_MODEL:?DECISION_MODEL manquant}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pull $$EMBED_MODEL"
        ollama pull "$$EMBED_MODEL"
        echo "Pull $$DECISION_MODEL"
        ollama pull "$$DECISION_MODEL"
        echo "ollama-init OK"
    networks: [ai_net]
    logging: *default-logging

  # ---------------- llama-server (llama.cpp, chat + vision) ----------------
  llama-server:
    image: ${IMG_LLAMA:?IMG_LLAMA manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    environment:
      TZ: ${TZ:-Europe/Paris}
    expose:
      - "8080"
    volumes:
      - ${DATA_DIR:-./data}/models:/models:ro
    # L'entrypoint de l'image server-cuda est déjà llama-server (pas de --server).
    # MTP: le GGUF contient les têtes MTP; --spec-type draft-mtp les active (flag vérifié par --help,
    # comportement à l'exécution NON VÉRIFIÉ sans GGUF). La stack de référence n'avait aucun flag
    # MTP explicite; --parallel 2 et --reasoning-budget 0 sont repris d'elle.
    command:
      - -m
      - /models/${LLM_GGUF:?LLM_GGUF manquant}
      - --mmproj
      - /models/${LLM_MMPROJ:?LLM_MMPROJ manquant}
      - --alias
      - ${LLM_ALIAS:-chat}
      - -c
      - "${LLM_CTX:-32768}"
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"
      - --flash-attn
      - "on"
      - --parallel
      - "2"
      - --reasoning-budget
      - "0"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "3"
    healthcheck:
      # curl présent dans l'image (vérifié)
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 32g
    #   cpus: 8.0

  # ---------------- LiteLLM (passerelle OpenAI-compatible) ----------------
  litellm:
    image: ${IMG_LITELLM:?IMG_LITELLM manquant (versions.env)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # config/litellm/config.yaml est écrit au lot suivant (A3)
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY manquant}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY manquant}
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Variables lues par config.yaml (os.environ/...)
      LLM_ALIAS: ${LLM_ALIAS:-chat}
      EMBED_MODEL: ${EMBED_MODEL:?EMBED_MODEL manquant}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
    expose:
      - "4000"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      # python3 présent dans l'image (vérifié); pas de curl/wget
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

# ==== APPS (lot A3) ====

  # ---------------- Open WebUI (chat, RAG Qdrant, STT/TTS, recherche web) ----------------
  open-webui:
    image: ${IMG_OPENWEBUI:?IMG_OPENWEBUI manquant (versions.env)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      WEBUI_URL: https://chat-ai.${BASE_DOMAIN:-local}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY manquant}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/openwebui
      # Chat: uniquement via LiteLLM (pas d'Ollama direct)
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY manquant}
      # RAG: Qdrant + embeddings via LiteLLM + extraction Docling
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY manquant}
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      RAG_EMBEDDING_MODEL: embeddinggemma
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: http://docling-serve:5001
      # Voix (whisper / kokoro ajoutés au lot A4: pas de depends_on dessus)
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://whisper:8000/v1
      AUDIO_STT_OPENAI_API_KEY: none
      AUDIO_STT_MODEL: whisper-1
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://kokoro:8880/v1
      AUDIO_TTS_OPENAI_API_KEY: none
      AUDIO_TTS_MODEL: kokoro
      AUDIO_TTS_VOICE: ${KOKORO_VOICE_DEFAULT:-ff_siwis}
      # Recherche web via SearXNG
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
    expose:
      - "8080"
    volumes:
      - ${DATA_DIR:-./data}/open-webui:/app/backend/data
    healthcheck:
      # curl présent dans l'image (HEALTHCHECK upstream identique)
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- n8n (éditeur + webhooks; mode queue, DB postgres "n8n", redis db 2) ----------------
  n8n:
    image: ${IMG_N8N:?IMG_N8N manquant (versions.env)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &n8n-env
      TZ: ${TZ:-Europe/Paris}
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      QUEUE_BULL_REDIS_DB: "2"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_HOST: automatisation.${BASE_DOMAIN:-local}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://automatisation.${BASE_DOMAIN:-local}/
      N8N_PROXY_HOPS: "1"
      # Données binaires sur volume partagé main/worker (voir note de livraison: la doc n8n déconseille filesystem en mode queue)
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /data/shared/binaryData
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_DISABLED: "true"
    expose:
      - "5678"
    volumes:
      - ${DATA_DIR:-./data}/n8n:/home/node/.n8n
      - ${DATA_DIR:-./data}/n8n_shared:/data/shared
    healthcheck:
      # Image sans curl garanti: sonde /healthz via node
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 2g
    #   cpus: 2.0

  # ---------------- n8n-worker (même image, mêmes env + volumes que n8n) ----------------
  n8n-worker:
    image: ${IMG_N8N:?IMG_N8N manquant (versions.env)}
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    volumes:
      - ${DATA_DIR:-./data}/n8n:/home/node/.n8n
      - ${DATA_DIR:-./data}/n8n_shared:/data/shared
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 2g
    #   cpus: 2.0

  # ---------------- docling-serve (extraction de documents, GPU CUDA 12.6) ----------------
  docling-serve:
    image: ${IMG_DOCLING:?IMG_DOCLING manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    environment:
      TZ: ${TZ:-Europe/Paris}
      DOCLING_SERVE_ENABLE_UI: "true"
    expose:
      - "5001"
    healthcheck:
      # /health sans authentification; python3 présent dans l'image (curl non garanti)
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 8g
    #   cpus: 4.0

  # ---------------- SearXNG (méta-recherche pour Open WebUI) ----------------
  searxng:
    image: ${IMG_SEARXNG:?IMG_SEARXNG manquant (versions.env)}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET manquant}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    expose:
      - "8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 1g
    #   cpus: 1.0

  # ---------------- Portainer CE (admin Docker; seul service avec docker.sock) ----------------
  portainer:
    image: ${IMG_PORTAINER:?IMG_PORTAINER manquant (versions.env)}
    restart: unless-stopped
    # HTTP 9000 interne (TLS terminé par caddy)
    command: ["--http-enabled"]
    environment:
      TZ: ${TZ:-Europe/Paris}
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR:-./data}/portainer:/data
    # Pas de healthcheck: l'image portainer est minimale (binaire seul: ni shell, ni curl, ni wget)
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 512m
    #   cpus: 1.0

  # ---------------- Caddy (reverse proxy, TLS interne; SEUL service qui publie des ports) ----------------
  caddy:
    image: ${IMG_CADDY:?IMG_CADDY manquant (versions.env)}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Europe/Paris}
      BASE_DOMAIN: ${BASE_DOMAIN:-local}
      # Caddy stocke sous $XDG_DATA_HOME/caddy => /data/caddy (root CA: /data/caddy/pki/authorities/local/root.crt)
      XDG_DATA_HOME: /data
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certificat:/srv/certificat:ro
      - ${DATA_DIR:-./data}/caddy:/data/caddy
    healthcheck:
      # API admin locale (localhost:2019) via wget busybox
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 512m
    #   cpus: 1.0

networks:
  ai_net:
    driver: bridge

volumes: {}
