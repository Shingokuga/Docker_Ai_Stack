# ============================================================
# Stack universelle — noyau (lot A2)
# Appel: ./stack <args>  ==  docker compose --env-file versions.env --env-file .env [...]
# Réseau interne unique ai_net. AUCUN ports: ici (seul caddy publiera 80/443, lot A3).
# ============================================================
name: ${COMPOSE_PROJECT_NAME:-ustack}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ---------------- Postgres 17 (bases: n8n, litellm, langfuse, openwebui) ----------------
  postgres:
    image: ${IMG_POSTGRES:?IMG_POSTGRES manquant (versions.env)}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: postgres
    expose:
      - "5432"
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ai_net]
    logging: *default-logging
    # Limites indicatives (décommenter si besoin):
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- Redis 7 (UN conteneur; noeviction exigé par Langfuse/n8n) ----------------
  redis:
    image: ${IMG_REDIS:?IMG_REDIS manquant (versions.env)}
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      TZ: ${TZ:-Europe/Paris}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | /bin/grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 1g
    #   cpus: 1.0

  # ---------------- Qdrant (vecteurs) ----------------
  qdrant:
    image: ${IMG_QDRANT:?IMG_QDRANT manquant (versions.env)}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY manquant}
    expose:
      - "6333"
    volumes:
      - ${DATA_DIR:-./data}/qdrant:/qdrant/storage
    healthcheck:
      # Image sans curl/wget: sonde HTTP /healthz via bash /dev/tcp (bash présent, vérifié)
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r l <&3; [[ $$l == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- Ollama (embeddings + modèle de décision) ----------------
  ollama:
    image: ${IMG_OLLAMA:?IMG_OLLAMA manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    environment:
      TZ: ${TZ:-Europe/Paris}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "4"
    expose:
      - "11434"
    volumes:
      - ${DATA_DIR:-./data}/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 16g
    #   cpus: 8.0

  # ---------------- ollama-init (one-shot: pull des modèles) ----------------
  ollama-init:
    image: ${IMG_OLLAMA:?IMG_OLLAMA manquant (versions.env)}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:?EMBED_MODEL manquant}
      DECISION_MODEL: ${DECISION_MODEL:?DECISION_MODEL manquant}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pull $$EMBED_MODEL"
        ollama pull "$$EMBED_MODEL"
        echo "Pull $$DECISION_MODEL"
        ollama pull "$$DECISION_MODEL"
        echo "ollama-init OK"
    networks: [ai_net]
    logging: *default-logging

  # ---------------- llama-server (llama.cpp, chat + vision) ----------------
  llama-server:
    image: ${IMG_LLAMA:?IMG_LLAMA manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    environment:
      TZ: ${TZ:-Europe/Paris}
    expose:
      - "8080"
    volumes:
      - ${DATA_DIR:-./data}/models:/models:ro
    # L'entrypoint de l'image server-cuda est déjà llama-server (pas de --server).
    # MTP: le GGUF contient les têtes MTP; --spec-type draft-mtp les active (flag vérifié par --help,
    # comportement à l'exécution NON VÉRIFIÉ sans GGUF). La stack de référence n'avait aucun flag
    # MTP explicite; --parallel 2 et --reasoning-budget 0 sont repris d'elle.
    command:
      - -m
      - /models/${LLM_GGUF:?LLM_GGUF manquant}
      - --mmproj
      - /models/${LLM_MMPROJ:?LLM_MMPROJ manquant}
      - --alias
      - ${LLM_ALIAS:-chat}
      - -c
      - "${LLM_CTX:-32768}"
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"
      - --flash-attn
      - "on"
      - --parallel
      - "2"
      - --reasoning-budget
      - "0"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "3"
    healthcheck:
      # curl présent dans l'image (vérifié)
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 32g
    #   cpus: 8.0

  # ---------------- LiteLLM (passerelle OpenAI-compatible) ----------------
  litellm:
    image: ${IMG_LITELLM:?IMG_LITELLM manquant (versions.env)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # config/litellm/config.yaml est écrit au lot suivant (A3)
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY manquant}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY manquant}
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Variables lues par config.yaml (os.environ/...)
      LLM_ALIAS: ${LLM_ALIAS:-chat}
      EMBED_MODEL: ${EMBED_MODEL:?EMBED_MODEL manquant}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
    expose:
      - "4000"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      # python3 présent dans l'image (vérifié); pas de curl/wget
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

# ==== APPS (lot A3) ====

  # ---------------- Open WebUI (chat, RAG Qdrant, STT/TTS, recherche web) ----------------
  open-webui:
    image: ${IMG_OPENWEBUI:?IMG_OPENWEBUI manquant (versions.env)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      WEBUI_URL: https://chat-ai.${BASE_DOMAIN:-local}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY manquant}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/openwebui
      # Compte admin automatique (créé au 1er démarrage si base vide)
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?WEBUI_ADMIN_EMAIL manquant}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?WEBUI_ADMIN_PASSWORD manquant}
      WEBUI_ADMIN_NAME: Admin
      # API keys pour scripts d'administration
      ENABLE_API_KEYS: "true"
      # Chat: uniquement via LiteLLM (pas d'Ollama direct)
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY manquant}
      # RAG: Qdrant + embeddings via LiteLLM + extraction Docling
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY manquant}
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      RAG_EMBEDDING_MODEL: embeddinggemma
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: http://docling-serve:5001
      # Voix (whisper / kokoro ajoutés au lot A4: pas de depends_on dessus)
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://whisper:8000/v1
      AUDIO_STT_OPENAI_API_KEY: none
      AUDIO_STT_MODEL: whisper-1
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://kokoro:8880/v1
      AUDIO_TTS_OPENAI_API_KEY: none
      AUDIO_TTS_MODEL: kokoro
      AUDIO_TTS_VOICE: ${KOKORO_VOICE_DEFAULT:-ff_siwis}
      # Recherche web via SearXNG
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
    expose:
      - "8080"
    volumes:
      - ${DATA_DIR:-./data}/open-webui:/app/backend/data
    healthcheck:
      # curl présent dans l'image (HEALTHCHECK upstream identique)
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- n8n (éditeur + webhooks; mode queue, DB postgres "n8n", redis db 2) ----------------
  n8n:
    image: ${IMG_N8N:?IMG_N8N manquant (versions.env)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &n8n-env
      TZ: ${TZ:-Europe/Paris}
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      QUEUE_BULL_REDIS_DB: "2"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_HOST: automatisation.${BASE_DOMAIN:-local}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://automatisation.${BASE_DOMAIN:-local}/
      N8N_PROXY_HOPS: "1"
      # Données binaires sur volume partagé main/worker (voir note de livraison: la doc n8n déconseille filesystem en mode queue)
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /data/shared/binaryData
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_DISABLED: "true"
      OBSCURA_CDP_URL: ws://obscura:9222
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?OBSCURA_CDP_TOKEN manquant}
    expose:
      - "5678"
    volumes:
      - ${DATA_DIR:-./data}/n8n:/home/node/.n8n
      - ${DATA_DIR:-./data}/n8n_shared:/data/shared
    healthcheck:
      # Image sans curl garanti: sonde /healthz via node
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 2g
    #   cpus: 2.0

  # ---------------- n8n-worker (même image, mêmes env + volumes que n8n) ----------------
  n8n-worker:
    image: ${IMG_N8N:?IMG_N8N manquant (versions.env)}
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    volumes:
      - ${DATA_DIR:-./data}/n8n:/home/node/.n8n
      - ${DATA_DIR:-./data}/n8n_shared:/data/shared
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 2g
    #   cpus: 2.0

  # ---------------- docling-serve (extraction de documents, GPU CUDA 12.6) ----------------
  docling-serve:
    image: ${IMG_DOCLING:?IMG_DOCLING manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    environment:
      TZ: ${TZ:-Europe/Paris}
      DOCLING_SERVE_ENABLE_UI: "true"
    expose:
      - "5001"
    healthcheck:
      # /health sans authentification; python3 présent dans l'image (curl non garanti)
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 8g
    #   cpus: 4.0

  # ---------------- SearXNG (méta-recherche pour Open WebUI) ----------------
  searxng:
    image: ${IMG_SEARXNG:?IMG_SEARXNG manquant (versions.env)}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET manquant}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    expose:
      - "8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 1g
    #   cpus: 1.0

  # ---------------- Portainer CE (admin Docker; seul service avec docker.sock) ----------------
  portainer:
    image: ${IMG_PORTAINER:?IMG_PORTAINER manquant (versions.env)}
    restart: unless-stopped
    # HTTP 9000 interne (TLS terminé par caddy)
    command: ["--http-enabled"]
    environment:
      TZ: ${TZ:-Europe/Paris}
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR:-./data}/portainer:/data
    # Pas de healthcheck: l'image portainer est minimale (binaire seul: ni shell, ni curl, ni wget)
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 512m
    #   cpus: 1.0

  # ---------------- Caddy (reverse proxy, TLS interne; SEUL service qui publie des ports) ----------------
  caddy:
    image: ${IMG_CADDY:?IMG_CADDY manquant (versions.env)}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Europe/Paris}
      BASE_DOMAIN: ${BASE_DOMAIN:-local}
      # Caddy stocke sous $XDG_DATA_HOME/caddy => /data/caddy (root CA: /data/caddy/pki/authorities/local/root.crt)
      XDG_DATA_HOME: /data

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certificat:/srv/certificat:ro
      - ${DATA_DIR:-./data}/caddy:/data/caddy
      - ${DATA_DIR:-./data}/comfyui/output:/comfyui/output:ro
    healthcheck:
      # API admin locale (localhost:2019) via wget busybox
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 512m
    #   cpus: 1.0

  # ---------------- Obscura (navigateur headless CDP pour Puppeteer/Playwright) ----------------
  # Puppeteer/Playwright se connectent ici en CDP avec l'en-tête Authorization: Bearer <token>.
  # Image distroless sans shell : aucun healthcheck shell possible.
  obscura:
    image: ${IMG_OBSCURA:?IMG_OBSCURA manquant (versions.env)}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      TZ: ${TZ:-Europe/Paris}
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?OBSCURA_CDP_TOKEN manquant (>= 32 octets)}
    expose:
      - "9222"
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 512m
    #   cpus: 1.0

  # ---------------- Obscura MCP (serveur MCP pour Open WebUI) ----------------
  # Même image que obscura, mode MCP HTTP. Exposé uniquement sur le réseau interne.
  # Open WebUI y accède via http://obscura-mcp:3000/mcp avec un token Bearer.
  obscura-mcp:
    image: ${IMG_OBSCURA:?IMG_OBSCURA manquant (versions.env)}
    restart: unless-stopped
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "3000"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      TZ: ${TZ:-Europe/Paris}
      OBSCURA_MCP_TOKEN: ${OBSCURA_MCP_TOKEN:?OBSCURA_MCP_TOKEN manquant (>= 32 octets)}
    expose:
      - "3000"
    networks: [ai_net]
    logging: *default-logging
    # Image distroless sans shell : aucun healthcheck shell possible
    #   mem_limit: 512m
    #   cpus: 1.0

# ==== APPS (lot A4) : voix, observabilité, stockage ====
# PRÉREQUIS PERMISSIONS (install.sh, lot B) — les bind mounts sont créés root par Docker; ces images
# tournent en non-root et NE font PAS de chown au démarrage:
#   install -d -o 101   -g 101   ${DATA_DIR}/clickhouse/data ${DATA_DIR}/clickhouse/logs   # clickhouse (user 101:101)
#   install -d -o 10001 -g 10001 ${DATA_DIR}/s3                                            # RustFS (uid 10001)
#   install -d -o 1000  -g 1000  ${DATA_DIR}/whisper                                       # speaches (user ubuntu)
# kokoro: aucun volume (modèle et voix intégrés à l'image).

  # ---------------- Kokoro-FastAPI (TTS, API OpenAI /v1/audio/speech) ----------------
  kokoro:
    image: ${IMG_KOKORO:?IMG_KOKORO manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Voix par défaut côté serveur (Open WebUI envoie aussi AUDIO_TTS_VOICE)
      DEFAULT_VOICE: ${KOKORO_VOICE_DEFAULT:-ff_siwis}
    expose:
      - "8880"
    healthcheck:
      # curl présent dans l'image (vérifié dans le Dockerfile v0.9.1); GET /health
      test: ["CMD", "curl", "-fsS", "http://localhost:8880/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- Whisper (STT, speaches = faster-whisper, API OpenAI /v1/audio/transcriptions) ----------------
  whisper:
    image: ${IMG_WHISPER:?IMG_WHISPER manquant (versions.env)}
    restart: unless-stopped
    <<: *gpu
    # init: reaper PID 1 (le téléchargement du modèle tourne en tâche de fond du shell)
    init: true
    environment:
      TZ: ${TZ:-Europe/Paris}
      WHISPER_MODEL: ${WHISPER_MODEL:?WHISPER_MODEL manquant}
      # Décharge le modèle de la VRAM après 300 s d'inactivité (partage de la carte avec le LLM)
      WHISPER__TTL: "300"
      ENABLE_UI: "false"
    # speaches 0.8.x n'auto-télécharge pas: le modèle doit être installé via POST /v1/models/<id>.
    # Ce wrapper (1) fait pointer l'alias OpenAI "whisper-1" (utilisé par Open WebUI) sur $WHISPER_MODEL,
    # (2) démarre le serveur, (3) en tâche de fond télécharge le modèle (idempotent: 201 si déjà présent).
    # Le healthcheck n'est vert que lorsque le modèle est installé.
    command:
      - bash
      - -c
      - |
        set -e
        printf '{"whisper-1":"%s"}\n' "$$WHISPER_MODEL" > model_aliases.json
        (
          until curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; do sleep 2; done
          until curl -fsS -X POST "http://127.0.0.1:8000/v1/models/$$WHISPER_MODEL"; do
            echo "whisper: téléchargement de $$WHISPER_MODEL en échec, nouvel essai dans 15 s" >&2
            sleep 15
          done
          echo "whisper: modèle $$WHISPER_MODEL prêt"
        ) &
        exec uvicorn --factory speaches.main:create_app
    expose:
      - "8000"
    volumes:
      # Cache Hugging Face (modèles faster-whisper) — voir PRÉREQUIS PERMISSIONS
      - ${DATA_DIR:-./data}/whisper:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      # 200 seulement si le modèle est installé localement (GET /v1/models/<id> => 404 sinon)
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:8000/v1/models/$$WHISPER_MODEL\" >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 8g
    #   cpus: 4.0

  # ---------------- ClickHouse (analytique Langfuse v4) ----------------
  clickhouse:
    image: ${IMG_CLICKHOUSE:?IMG_CLICKHOUSE manquant (versions.env)}
    restart: unless-stopped
    user: "101:101"
    environment:
      TZ: ${TZ:-Europe/Paris}
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD manquant}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    expose:
      - "8123"
      - "9000"
    volumes:
      - ${DATA_DIR:-./data}/clickhouse/data:/var/lib/clickhouse
      - ${DATA_DIR:-./data}/clickhouse/logs:/var/log/clickhouse-server
    healthcheck:
      # wget présent dans l'image (healthcheck identique au compose officiel Langfuse)
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- S3 (RustFS: API 9000, console 9001 via Caddy "stockage") ----------------
  s3:
    image: ${IMG_S3:?IMG_S3 manquant (versions.env)}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      TZ: ${TZ:-Europe/Paris}
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:?S3_ROOT_USER manquant}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD manquant}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    expose:
      - "9000"
      - "9001"
    volumes:
      # Utilisateur de l'image: uid 10001 — voir PRÉREQUIS PERMISSIONS
      - ${DATA_DIR:-./data}/s3:/data
    healthcheck:
      # curl présent dans l'image; sondes API et console (identiques au compose upstream, sans TLS)
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 2g
    #   cpus: 2.0

  # ---------------- s3-init (one-shot: crée le bucket "langfuse", idempotent) ----------------
  s3-init:
    image: ${IMG_S3_INIT:?IMG_S3_INIT manquant (versions.env)}
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:?S3_ROOT_USER manquant}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD manquant}
      AWS_DEFAULT_REGION: us-east-1
      # aws-cli v2 ajoute des checksums par défaut que les S3 non-AWS ne gèrent pas toujours
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: langfuse
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1; then
          echo "s3-init: bucket $$S3_BUCKET déjà présent"
        else
          aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET" \
            || aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET"
          echo "s3-init: bucket $$S3_BUCKET créé"
        fi
        echo "s3-init OK"
    networks: [ai_net]
    logging: *default-logging

  # ---------------- Langfuse worker (traitement asynchrone, port 3030) ----------------
  langfuse-worker:
    image: ${IMG_LANGFUSE_WORKER:?IMG_LANGFUSE_WORKER manquant (versions.env)}
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      TZ: ${TZ:-Europe/Paris}
      NEXTAUTH_URL: https://suivi-ia.${BASE_DOMAIN:-local}
      # POSTGRES_PASSWORD doit être URL-safe (hex), il est inséré tel quel dans l'URL
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT manquant}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY manquant}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD manquant}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      # Stockage objet (RustFS): événements + médias dans le bucket "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ROOT_USER:?S3_ROOT_USER manquant}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD manquant}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://s3:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ROOT_USER:?S3_ROOT_USER manquant}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD manquant}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://s3:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    expose:
      - "3030"
    healthcheck:
      # wget présent dans l'image (UBI micro + wget, cf. Dockerfile); route /api/health du worker
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3030/api/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 2g
    #   cpus: 2.0

  # ---------------- Langfuse web (UI + API, https://suivi-ia.${BASE_DOMAIN}) ----------------
  langfuse-web:
    image: ${IMG_LANGFUSE_WEB:?IMG_LANGFUSE_WEB manquant (versions.env)}
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET manquant}
      LANGFUSE_TRUSTED_PROXY_COUNT: "1"
      AUTH_DISABLE_SIGNUP: "true"
      # Initialisation headless: org, projet, clés API et compte admin (clés réutilisées par LiteLLM)
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:?LANGFUSE_INIT_ORG_ID manquant}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:?LANGFUSE_INIT_PROJECT_ID manquant}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?LANGFUSE_INIT_PROJECT_PUBLIC_KEY manquant}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?LANGFUSE_INIT_PROJECT_SECRET_KEY manquant}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?LANGFUSE_INIT_USER_EMAIL manquant}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD manquant}
    expose:
      - "3000"
    healthcheck:
      # Next.js standalone écoute sur $HOSTNAME (= IP du conteneur): ne pas sonder 127.0.0.1
      test: ["CMD-SHELL", "wget -q --spider http://$${HOSTNAME}:3000/api/public/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 4g
    #   cpus: 2.0

  # ---------------- ComfyUI (génération d'images) ----------------
  # Image communautaire yanwk/comfyui-boot: pré-installée avec les dépendances GPU,
  # custom nodes et workflow UI. Les modèles sont fournis via le volume /models
  # (téléchargés par download-models.sh). Exposé uniquement via Caddy (lot B).
  comfyui:
    image: yanwk/comfyui-boot:nightly-20261030-b1aa558
    container_name: comfyui
    profiles: ["comfyui"]
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      COMFYUI_USER: comfyui
      COMFYUI_GROUP: comfyui
      COMFYUI_USER_ID: "1000"
      COMFYUI_GROUP_ID: "1000"
      COMFYUI_START_COMMAND: "python /comfyui/main.py --listen 0.0.0.0 --port 8188 --disable-smart-memory"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${DATA_DIR:-./data}/comfyui/models:/models
      - ${DATA_DIR:-./data}/comfyui/user:/comfyui/user
      - ${DATA_DIR:-./data}/comfyui/input:/comfyui/input
      - ${DATA_DIR:-./data}/comfyui/output:/comfyui/output
      - ${DATA_DIR:-./data}/comfyui/temp:/tmp/comfyui
      - ${DATA_DIR:-./data}/comfyui/custom_nodes:/comfyui/custom_nodes
    expose:
      - "8188"
    <<: *gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8188/api/system_stats >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks: [ai_net]
    logging: *default-logging
    #   mem_limit: 16g
    #   cpus: 4.0

networks:
  ai_net:
    driver: bridge

volumes: {}
