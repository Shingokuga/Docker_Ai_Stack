name: CI - Stack Universelle

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  validate-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .env
        run: |
          cp .env.example .env
          bash scripts/gen-secrets.sh

      - name: Download models (select only)
        run: bash download-models.sh --select-only

      - name: Verify compose is parseable
        run: ./stack config -q
