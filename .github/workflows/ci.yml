name: CI - Stack Universelle

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up .env
        run: |
          cp .env.example .env
          bash scripts/gen-secrets.sh .env

      - name: Show Docker info
        run: |
          docker version
          docker info --format '{{ .OSType }}/{{ .Architecture }}'

      - name: Verify compose is parseable
        run: ./stack config > /dev/null

      - name: Run test-stack.sh
        run: |
          chmod +x test-stack.sh
          ./test-stack.sh --wait 600
